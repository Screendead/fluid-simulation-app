[workspace]
resolver = "3"
members = ["crates/fluid-core", "crates/fluid-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
fluid-core = { path = "crates/fluid-core" }
wgpu = { version = "30.0.1", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
