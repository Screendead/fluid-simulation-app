[package]
name = "fluid-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

# film: the desk look-oracle (scripts/film.sh). Never in the iOS build.
[features]
film = []

[[example]]
name = "film"
required-features = ["film"]

[dependencies]
wgpu = { workspace = true, features = ["std", "metal", "parking_lot", "wgsl"] }

# Off Apple there is no Metal backend, and a backendless wgpu panics in
# Instance::new before the adapterless self-skip can run. The noop
# backend compiles to nothing, stays disabled at run time, and lets a
# bare CI runner fail adapter discovery gracefully instead.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
wgpu = { workspace = true, features = ["noop"] }
