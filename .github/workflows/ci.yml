name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-ios,wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4,wasm-bindgen@0.2.127,xcodegen
      - run: scripts/gate.sh
      - run: scripts/build-web.sh
      # Unsigned: CI proves the shell compiles and links; only a device proves it runs.
      - run: |
          cd platforms/ios
          xcodegen generate --quiet
          xcodebuild -project FluidApp.xcodeproj -scheme FluidApp -configuration Release \
            -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO build | tail -20
