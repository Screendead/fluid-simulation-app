name: CI

# macOS runners bill at 10x; unrestricted push triggers burned the
# whole free tier in one month (2026-08). Topic branches rely on the
# local gate; run CI on demand with workflow_dispatch.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything portable, at 1x billing. The iOS build inside gate.sh
  # self-skips off macOS; GPU tests self-skip on adapterless runners.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - run: scripts/gate.sh
  # Only what needs macOS (10x billing): the iOS static library and
  # the unsigned shell build. CI proves the shell compiles and links;
  # only a device proves it runs.
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: cargo build -p fluid-ffi --target aarch64-apple-ios --target aarch64-apple-ios-sim
      - run: brew install xcodegen
      - run: |
          cd platforms/ios
          xcodegen generate --quiet
          xcodebuild -project FluidApp.xcodeproj -scheme FluidApp -configuration Release \
            -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO build | tail -20
