name: FluidApp
options:
  bundleIdPrefix: com.screendead
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8N575942RT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    FLUID_RUST_TARGET[sdk=iphoneos*]: aarch64-apple-ios
    FLUID_RUST_TARGET[sdk=iphonesimulator*]: aarch64-apple-ios-sim
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/$(FLUID_RUST_TARGET)/$(FLUID_RUST_PROFILE)
  configs:
    Debug:
      FLUID_RUST_PROFILE: debug
    Release:
      FLUID_RUST_PROFILE: release
targets:
  FluidApp:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../crates/fluid-ffi/include
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        OTHER_LDFLAGS: -lfluid_ffi
    preBuildScripts:
      - name: Build fluid-ffi
        script: exec "$SRCROOT/../../scripts/build-rust-ios.sh"
        basedOnDependencyAnalysis: false
