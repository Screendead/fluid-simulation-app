name: FluidApp
options:
  bundleIdPrefix: com.screendead
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8N575942RT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/aarch64-apple-ios/debug
    Release:
      LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/aarch64-apple-ios/release
targets:
  FluidApp:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../crates/fluid-ffi/include
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        OTHER_LDFLAGS: -lfluid_ffi
    preBuildScripts:
      - name: Build fluid-ffi
        script: exec "$SRCROOT/../../scripts/build-rust-ios.sh"
        basedOnDependencyAnalysis: false
