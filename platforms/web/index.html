<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluid Box</title>
  <style>
    html, body { margin: 0; height: 100%; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #778; }
    #hud {
      position: fixed; top: 1rem; left: 1rem; max-width: calc(100% - 2rem);
      font: 14px/1.5 ui-monospace, monospace; color: #fff;
      background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 1rem;
    }
    button { font: inherit; padding: 0.5rem 1rem; }
    pre { margin: 1rem 0 0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="surface"></canvas>
  <div id="hud">
    <button id="enable">Enable motion</button>
    <pre id="readout">waiting for motion</pre>
    <pre id="stats"></pre>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
